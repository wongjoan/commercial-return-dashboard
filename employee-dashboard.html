<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Performance — Glocomp</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/gc.css">
</head>
<body>
<div class="viz-root" id="root">
  <header class="app-header">
    <div>
      <h1>My Performance</h1>
      <p class="sub" id="who">Loading…</p>
      <span class="tag">Anonymised demo data · your own scorecard only · no pay information is shown on this page</span>
    </div>
    <div class="header-controls">
      <a class="gov-header-btn" id="toDashboard" href="/dashboard" style="text-decoration:none;" hidden>Management dashboard →</a>
      <button class="theme-toggle" id="themeToggle" type="button">Switch to dark</button>
      <button class="btn" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>
  <main id="meContent"><p class="loading">Loading your scorecard…</p></main>
</div>
<script src="assets/gc.js"></script>
<script>
(function () {
  "use strict";
  GC.theme(document.getElementById("root"), document.getElementById("themeToggle"));
  document.getElementById("logoutBtn").addEventListener("click", GC.logout);
  var host = document.getElementById("meContent");

  GC.api("/api/session").then(function (s) {
    if (s.user.level !== "employee") document.getElementById("toDashboard").hidden = false;
    if (s.user.level === "director") {
      host.innerHTML = '<div class="notice">The Director is not scored in this prototype. <a href="/dashboard">Open the management dashboard →</a></div>';
      return null;
    }
    return GC.api("/api/me").then(function (card) { render(card, s); });
  }).catch(function (e) { host.innerHTML = '<p class="err">' + GC.esc(e.message) + "</p>"; });

  function render(card, s) {
    document.getElementById("who").textContent = card.employee.name + " · " + card.employee.title + " · " + card.employee.dept + " · Period " + card.period;
    var focus = card.improvement_focus;
    host.innerHTML =
      GC.scoreTiles(card) +
      '<div class="grid cols-2" style="margin-bottom:14px;">' +
        GC.weightCard(card, { readOnlyNote: "<b>View only.</b> Weightage and targets are set by the role template or agreed with your manager" +
          (card.agreed_with ? " (" + GC.esc(card.agreed_with) + ")" : "") + ". To discuss a change, raise it in your next 1:1 — every change is recorded in an audit log." }) +
        '<div class="card"><h3>Progress over the last 4 quarters</h3><p class="card-sub">Your overall score each quarter, calculated with your current weightage</p>' +
          GC.spark(card.trend, 360, 90) +
          '<table class="data-table" style="margin-top:8px;"><tbody>' + card.trend.map(function (t) {
            return "<tr><td>" + t.period + "</td><td>" + GC.meter(t.overall) + "</td></tr>";
          }).join("") + "</tbody></table></div>" +
      "</div>" +
      '<div class="card" style="margin-bottom:14px;"><div class="card-head"><div><h3>KPI breakdown</h3>' +
        '<p class="card-sub">Targets agreed with ' + GC.esc(card.agreed_with || "your manager") + " · highlighted row = biggest gap</p></div>" +
        '<button class="table-toggle" type="button" data-explain="overall">Explain my score</button></div>' + GC.kpiTable(card) + "</div>" +
      (focus && focus.length
        ? '<div class="card"><h3>Your improvement focus</h3><p class="card-sub">Where the most points can be recovered, with a suggested next step to discuss with your manager</p>' +
          '<table class="data-table"><thead><tr><th>KPI</th><th class="num">Achieved</th><th class="num">Points to recover</th><th>Suggested action</th></tr></thead><tbody>' +
          focus.map(function (f) {
            return "<tr><td><b>" + GC.esc(f.name) + '</b></td><td class="num">' + f.attainment_pct.toFixed(0) + '%</td><td class="num">' + f.points_lost.toFixed(1) + "</td><td>" + GC.esc(f.suggested_action) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="card"><h3>Your improvement focus</h3><p class="card-sub" style="margin:0;">No material gaps this quarter — keep going.</p></div>');
    GC.wireExplain(host, card);
  }
})();
</script>
</body>
</html>
