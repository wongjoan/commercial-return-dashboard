<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dashboard — Meridian Tech Solutions</title>
<style>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
  }

  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success-text:   #006300;

    --series-1: #2570cc; /* blue      -> Revenue / Sales dept (darkened slightly from #2a78d6 so it clears 4.5:1 as text, e.g. gov-edit-btn) */
    --series-2: #eb6834; /* orange    -> NGP / Product Mgmt dept */
    --series-3: #1baf7a; /* aqua      -> EBITDA / Consulting dept */
    --series-4: #eda100; /* yellow    -> Sales Support dept */
    --series-5: #e87ba4; /* magenta   -> Delivery dept */

    --seq-100: #cde2fb; --seq-450: #2a78d6;

    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;

    background: var(--page-plane);
    color: var(--text-primary);
    min-height: 100vh;
  }
  .viz-root[data-theme="dark"], .viz-root.theme-dark {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --success-text:   #0ca30c;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
  }

  header.app-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 24px 28px 16px; max-width: 1240px; margin: 0 auto;
  }
  header.app-header h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  header.app-header .sub { color: var(--text-secondary); font-size: 13px; margin: 0; }
  header.app-header .tag {
    display: inline-block; margin-top: 8px; font-size: 11px; padding: 3px 8px;
    border-radius: 20px; background: var(--surface-1); border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .theme-toggle:hover { color: var(--text-primary); }

  .tabs-row {
    max-width: 1240px; margin: 0 auto; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--gridline); flex-wrap: wrap;
  }
  nav.tabs {
    display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0;
  }
  nav.tabs button {
    appearance: none; border: none; background: none; padding: 10px 14px; font-size: 13.5px;
    font-weight: 550; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button:hover { color: var(--text-primary); }
  nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); }

  .filter-row {
    max-width: 1240px; margin: 0 auto; padding: 14px 28px 0; display: flex;
    align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .filter-row .label { font-size: 12px; color: var(--text-muted); margin-right: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: none; background: var(--surface-1); color: var(--text-secondary);
    padding: 6px 12px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    padding: 5px 11px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }

  main { max-width: 1240px; margin: 0 auto; padding: 18px 28px 60px; }
  .view[hidden] { display: none; }

  .grid { display: grid; gap: 14px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-2 { grid-template-columns: 1.4fr 1fr; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 920px) {
    .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
    .grid.cols-2 { grid-template-columns: 1fr; }
    .grid.cols-3 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .card h3 { font-size: 13.5px; margin: 0 0 2px; font-weight: 650; }
  .card .card-sub { font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .table-toggle {
    border: none; background: none; color: var(--text-muted); font-size: 11px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .table-toggle:hover { color: var(--text-primary); }

  /* Stat tile */
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; }
  .stat-tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: proportional-nums; }
  .stat-tile .delta { font-size: 12px; margin-top: 4px; }
  .stat-tile .delta.good { color: var(--success-text); }
  .stat-tile .delta.bad { color: var(--status-critical); }
  .stat-tile .delta.flat { color: var(--text-muted); }

  /* Legend */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); background:none; border:none; cursor:pointer; padding:0; }
  .legend .swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend .swatch.rect { width: 10px; height: 10px; border-radius: 2px; }
  .legend .item[data-off="true"] { opacity: .35; }

  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .axis-label { fill: var(--text-muted); font-size: 10.5px; }
  .grid-line { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.14); opacity: 0; transition: opacity .08s ease; min-width: 140px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-title { color: var(--text-secondary); font-size: 11px; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; padding: 1px 0; }
  .tooltip .t-key { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .tooltip .t-line { width: 10px; height: 2px; display: inline-block; border-radius: 1px; }
  .tooltip .t-val { font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }

  /* Table */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th {
    text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .02em; padding: 7px 10px; border-bottom: 1px solid var(--gridline);
    white-space: nowrap;
  }
  table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  table.data-table td.num, table.data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.data-table tbody tr:hover { background: rgba(128,128,128,0.06); }
  table.data-table caption { text-align: left; caption-side: bottom; font-size: 11px; color: var(--text-muted); padding-top: 6px; }

  /* Meter */
  .meter-wrap { display: flex; align-items: center; gap: 8px; min-width: 130px; }
  .meter-track { flex: 1; height: 6px; border-radius: 4px; background: var(--gridline); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 4px; }
  .meter-val { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

  /* Badge / status */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px; white-space: nowrap;
  }
  .badge.good { color: var(--status-good); background: color-mix(in srgb, var(--status-good) 14%, transparent); }
  .badge.warning { color: #8a6300; background: color-mix(in srgb, var(--status-warning) 22%, transparent); }
  .badge.critical { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); }
  .viz-root[data-theme="dark"] .badge.warning, .viz-root.theme-dark .badge.warning { color: #ffd980; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.good .dot { background: var(--status-good); }
  .badge.warning .dot { background: var(--status-warning); }
  .badge.critical .dot { background: var(--status-critical); }

  .flag-list { display: flex; flex-direction: column; gap: 10px; }
  .flag-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gridline); }
  .flag-item:last-child { border-bottom: none; padding-bottom: 0; }
  .flag-item .who { font-size: 13px; font-weight: 600; }
  .flag-item .why { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .flag-item .action { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

  .pay-pill { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }

  .attr-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; }
  .attr-seg { display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: #fff; font-weight: 600; }
  .attr-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--text-secondary); }
  .attr-legend .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  .proj-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .proj-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .proj-head h4 { margin: 0; font-size: 14px; }
  .proj-meta { font-size: 11.5px; color: var(--text-muted); }
  .proj-stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 10px 0; }
  .proj-stats div .k { font-size: 10.5px; color: var(--text-muted); }
  .proj-stats div .v { font-size: 14px; font-weight: 650; }

  .method-block { margin-bottom: 22px; }
  .method-block h3 { font-size: 14px; margin-bottom: 6px; }
  .method-block p, .method-block li { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .method-block ul { margin: 6px 0; padding-left: 18px; }

  .callout { border: 1px solid var(--border); border-left: 3px solid var(--text-primary); border-radius: 8px; padding: 12px 14px; margin-bottom: 22px; background: var(--page-plane); }
  .callout h3 { font-size: 13px; margin: 0 0 6px; }
  .callout p, .callout li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin: 4px 0; }
  .callout ul { margin: 4px 0; padding-left: 18px; }
  .callout b { color: var(--text-primary); }

  .hr-case-row select, .hr-case-row input[type="text"] {
    font: inherit; font-size: 12px; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); width: 100%;
  }
  .hr-flag-pill { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 10px; margin: 1px 3px 1px 0; white-space: nowrap; }
  .hr-flag-pill.pay-equity { color: var(--status-warning); background: color-mix(in srgb, var(--status-warning) 22%, transparent); }
  .hr-flag-pill.income-volatility { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); }
  .hr-flag-pill.performance { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); }
  .chip.mgmt-approve[aria-pressed="true"] { background: var(--status-good); color: #fff; border-color: var(--status-good); }
  .chip.mgmt-decline[aria-pressed="true"] { background: var(--text-muted); color: var(--surface-1); border-color: var(--text-muted); }

  /* Manager-facing simple view: plain-language cards, one-click approve/dismiss */
  .mgr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 760px) { .mgr-grid { grid-template-columns: 1fr; } }
  .mgr-card { border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
  .mgr-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .mgr-card-head .who { font-size: 13.5px; font-weight: 650; }
  .mgr-card-head .proj-meta { margin-top: 1px; }
  .mgr-reasons { margin: 9px 0; padding-left: 18px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
  .mgr-reasons li { margin-bottom: 2px; }
  .mgr-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .mgr-approve-btn { border: 1px solid var(--series-1); background: var(--series-1); color: #fff; font-weight: 650; border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .mgr-dismiss-btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .mgr-dismiss-btn:hover { color: var(--text-primary); }
  .mgr-reviewed-note { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .mgr-reconsider-btn { border: none; background: none; color: var(--series-1); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
  .formula {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12.5px;
    background: var(--page-plane); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; color: var(--text-primary);
  }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------------- governance modal ---------------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,11,11,0.45); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: var(--surface-1); border-radius: 14px; width: 100%; max-width: 620px;
    box-shadow: 0 20px 60px rgba(0,0,0,.28); border: 1px solid var(--border);
    display: flex; flex-direction: column; max-height: 92vh;
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 14px; }
  .modal-head h2 { margin: 0 0 6px; font-size: 17px; color: var(--text-primary); }
  .modal-sub { margin: 0; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .modal-close {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .modal-close:hover { color: var(--text-primary); }
  .modal-divider { border-top: 1px solid var(--gridline); margin: 0 22px; }
  .modal-body { padding: 18px 22px 22px; overflow-y: auto; }

  .gov-active-note { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 4px 0 22px; }
  .gov-version-tag {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; color: var(--text-primary); background: var(--page-plane);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; font-size: 12px;
  }

  .gov-step { display: flex; gap: 12px; margin-bottom: 6px; }
  .gov-step .step-num {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--page-plane);
    border: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .gov-step-title { font-size: 14.5px; font-weight: 650; color: var(--text-primary); margin: 2px 0 2px; }
  .gov-step-body { flex: 1; min-width: 0; }
  .gov-step-help { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 12px; }

  .gov-select {
    width: 100%; appearance: none; border: 1px solid var(--border); background: var(--page-plane);
    color: var(--text-primary); border-radius: 9px; padding: 10px 34px 10px 12px; font-size: 14px; font-family: inherit;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23898781'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }

  .gov-weight-head { display: grid; grid-template-columns: 1fr 64px 1fr 46px; gap: 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); padding-bottom: 4px; border-bottom: 1px solid var(--gridline); margin-bottom: 4px; }
  .gov-weight-row { display: grid; grid-template-columns: 1fr 64px 1fr 46px; align-items: center; gap: 10px; padding: 7px 0; }
  .gov-weight-row .role-name { font-size: 13px; color: var(--text-primary); }
  .gov-weight-input {
    width: 100%; border: 1px solid var(--border); background: var(--page-plane); border-radius: 7px;
    padding: 6px; font-size: 13px; text-align: center; color: var(--text-primary); font-family: inherit;
  }
  .gov-share-track { height: 6px; border-radius: 4px; background: var(--gridline); overflow: hidden; }
  .gov-share-fill { height: 100%; border-radius: 4px; }
  .gov-share-pct { font-size: 12.5px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }

  .gov-breakdown { background: var(--page-plane); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 14px 0 18px; }
  .gov-breakdown-title { font-size: 11.5px; color: var(--text-muted); margin: 0 0 8px; }
  .gov-bd-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .gov-bd-row .amt { font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .gov-bd-row .delta { font-size: 11.5px; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  .gov-bd-row .delta.up { color: var(--status-good); }
  .gov-bd-row .delta.down { color: var(--status-critical); }
  .gov-bd-row .delta.flat { color: var(--text-muted); }

  .gov-radio-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; cursor: pointer;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .gov-radio-card.selected { background: color-mix(in srgb, var(--series-1) 10%, var(--surface-1)); border-color: var(--series-1); }
  .gov-radio-card input { margin-top: 3px; }
  .gov-radio-card .rt { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  .gov-radio-card .rs { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

  .gov-reason-label { font-size: 13px; font-weight: 600; color: var(--text-primary); margin: 16px 0 6px; }
  .gov-reason {
    width: 100%; border: 1px solid var(--border); background: var(--page-plane); border-radius: 9px;
    padding: 9px 11px; font-size: 13px; font-family: inherit; color: var(--text-primary); resize: vertical; min-height: 52px;
  }

  .gov-checklist { margin: 18px 0 14px; display: flex; flex-direction: column; gap: 7px; }
  .gov-check-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; }
  .gov-check-icon { flex: none; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .gov-check-row.pass { color: var(--text-secondary); }
  .gov-check-row.pass .gov-check-icon { color: var(--status-good); }
  .gov-check-row.pending { color: var(--text-muted); }
  .gov-check-row.pending .gov-check-icon { color: var(--text-muted); }
  .gov-check-row.fail { color: var(--status-critical); }
  .gov-check-row.fail .gov-check-icon { color: var(--status-critical); }

  .gov-register-btn { width: 100%; border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 650; cursor: pointer; margin-top: 4px; }
  .gov-register-btn.enabled { background: var(--series-1); color: #fff; }
  .gov-register-btn.disabled { background: var(--gridline); color: var(--text-muted); cursor: not-allowed; }

  .gov-success {

      attribution: [["Sales", 55, "var(--series-1)"], ["Sales Support", 25, "var(--series-4)"], ["Product Management", 20, "var(--series-2)"]], flag: null },
    { name: "Project Falcon", type: "New Logo — Complex Solution", status: "Active", revenue: 1680000, cost: 1220000, ngp: 460000, collected: 1193000, dso: 96,
      attribution: [["Sales", 30, "var(--series-1)"], ["Consulting", 35, "var(--series-3)"], ["Product Management", 15, "var(--series-2)"], ["Delivery", 20, "var(--series-5)"]], flag: "NGP margin 27.4% vs. 35% target; collections at 71%, DSO 96 days" }
  ];

  function scoreBandLabel(pct) {
    return pct < 0.70 ? "Needs improvement" : pct < 0.90 ? "Meeting expectations" : "Exceeding expectations";
  }

  function scoreBandKind(pct) {
    return pct < 0.70 ? "critical" : pct < 0.90 ? "warning" : "good";
  }

  function statTileMini(label, value) {
    return '<div><div class="k">' + label + '</div><div class="v">' + value + "</div></div>";
  }

  function employeeDealPool(p) {
    var deptRec = departments.filter(function (d) { return d.name === p.dept; })[0];
    var deptHeadcount = deptRec ? deptRec.headcount : 1;
    var items = [];
    projects.forEach(function (proj) {
      var match = proj.attribution.filter(function (a) { return a[0] === p.dept; })[0];
      if (!match) return;
      var deptShare = match[1] / 100;
      var deptAttrNgp = proj.ngp * deptShare;
      items.push({ project: proj.name, projType: proj.type, deptSharePct: match[1], perPerson: deptAttrNgp / Math.max(1, deptHeadcount) });
    });
    return items;
  }


  var state = { selectedEmployee: null };

  function populateMeSelector() {
    var sel = document.getElementById("meEmployeeSelect");
    if (!sel) return;
    if (!state.selectedEmployee || !individuals.some(function (p) { return p.name === state.selectedEmployee; })) {
      state.selectedEmployee = individuals[0].name;
    }
    var sorted = individuals.slice().sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    sel.innerHTML = sorted.map(function (p) {
      return '<option value="' + p.name.replace(/"/g, "&quot;") + '"' + (p.name === state.selectedEmployee ? " selected" : "") + ">" + p.name + " — " + p.role + "</option>";
    }).join("");
  }

  function renderMeView() {
    populateMeSelector();
    var p = individuals.filter(function (x) { return x.name === state.selectedEmployee; })[0] || individuals[0];
    state.selectedEmployee = p.name;
    var kpi = computeKpiSim(p);
    var dealPool = employeeDealPool(p);
    var dealPoolHtml = dealPool.length
      ? '<div class="gov-breakdown"><div id="meDealRows">' + dealPool.map(function (d) {
          return '<div class="gov-bd-row"><span>' + d.project + " (" + d.deptSharePct + "% attributed to " + p.dept + ")</span><span class=\"amt\">" + fmtMoney(d.perPerson) + "</span></div>";
        }).join("") + "</div></div>"
      : '<p class="card-sub" style="margin:0;">No active or complete project currently attributes NGP to ' + p.dept + ".</p>";

    var host = document.getElementById("meContent");
    host.innerHTML =
      '<div class="grid cols-2" style="margin-bottom:14px;">' +
      '<div class="card">' +
      "<h3>" + p.name + "</h3>" +
      '<p class="card-sub">' + p.role + " · " + p.dept + " · " + p.pay + "-based</p>" +
      '<div class="proj-stats" style="margin-top:2px;">' +
      statTileMini("Base salary", fmtMoney(p.base)) + statTileMini("Bonus/commission", fmtMoney(p.variable)) + statTileMini("OTE", fmtMoney(p.ote)) +
      "</div>" +
      '<p class="card-sub" style="margin:14px 0 6px;">Variable pay earned so far this cycle — real figures from the Glocomp comp data</p>' +
      meter(p.ote > 0 ? p.variable / p.ote : 0, p.splitPct > 0.35 ? "warning" : "good") +
      "</div>" +
      '<div class="card">' +
      "<h3>Your overall performance (estimated)</h3>" +
      '<p class="card-sub">Blends your financial and non-financial components below into one number — no real operational actuals were supplied yet, so this is a labeled simulation (see the Methodology tab on the employer dashboard, sections 3 and 10)</p>' +
      meter(kpi.pct, scoreBandKind(kpi.pct)) +
      '<p class="card-sub" style="margin-top:10px;">' + scoreBandLabel(kpi.pct) + "</p>" +
      "</div>" +
      "</div>" +
      '<div class="grid cols-2" style="margin-bottom:14px;">' +
      '<div class="card">' +
      "<h3>Financial component</h3>" +
      '<p class="card-sub">Revenue/NGP/collections-linked attainment — weighted ' + fmtPct(kpi.financialShare, 0) + " of your overall score</p>" +
      meter(kpi.finPct, kpi.finPct < 0.70 ? "critical" : kpi.finPct < 0.90 ? "warning" : "good") +
      "</div>" +
      '<div class="card">' +
      "<h3>Non-financial component</h3>" +
      '<p class="card-sub">' + kpi.metric + " — the real formula for " + p.dept + " (see Methodology, section 3)</p>" +
      meter(kpi.opsPct, kpi.opsPct < 0.70 ? "critical" : kpi.opsPct < 0.90 ? "warning" : "good") +
      '<p class="card-sub" style="margin-top:8px;">' + kpi.opsActual + "% actual vs. " + kpi.opsTarget + "% target (estimated)</p>" +
      "</div>" +
      "</div>" +
      '<div class="card" style="margin-bottom:14px;">' +
      "<h3>Attributed deal pool (illustrative)</h3>" +
      '<p class="card-sub">This employee\'s pro-rata share of ' + p.dept + "'s attributed NGP on active/complete projects, split evenly across the department's headcount — illustrative, since individual deal assignment wasn't in the dataset</p>" +
      dealPoolHtml +
      "</div>" +
      '<div class="card">' +
      "<h3>Peer-anonymized pay band</h3>" +
      '<p class="card-sub">Where this base salary sits against others in the same role — individual peer salaries are never shown, only the distribution</p>' +
      salaryBandFullHtml(p.role, p.base, "You") +
      "</div>";

    try {
      var params = new URLSearchParams(window.location.search);
      params.set("employee", state.selectedEmployee);
      window.history.replaceState(null, "", window.location.pathname + "?" + params.toString());
    } catch (e) { /* ignore */ }
  }

  var meEmployeeSelect = document.getElementById("meEmployeeSelect");
  if (meEmployeeSelect) {
    meEmployeeSelect.addEventListener("change", function (e) {
      state.selectedEmployee = e.target.value;
      renderMeView();
    });
  }

  var themeBtn = document.getElementById("themeToggle");
  var root = document.getElementById("root");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var currentTheme = prefersDark ? "dark" : "light";
  function applyTheme() {
    root.setAttribute("data-theme", currentTheme);
    themeBtn.textContent = currentTheme === "dark" ? "Switch to light" : "Switch to dark";
  }
  themeBtn.addEventListener("click", function () {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme();
  });
  applyTheme();

  // Cross-link to the employer dashboard: the real claude.ai URL when hosted there, a sibling
  // file when this page is opened standalone (same folder as commercial-return-dashboard.html).
  var toEmployerLink = document.getElementById("toEmployerLink");
  if (toEmployerLink && window.claude && typeof window.claude.use === "function") {
    toEmployerLink.href = "https://claude.ai/artifact/JTMmLzjzNxT4iLrvYpqB8o";
  }

  try {
    var initParams = new URLSearchParams(window.location.search);
    var initEmp = initParams.get("employee");
    if (initEmp && individuals.some(function (p) { return p.name === initEmp; })) state.selectedEmployee = initEmp;
  } catch (e) { /* ignore */ }

  renderMeView();
})();

</script>
</body>
</html>
